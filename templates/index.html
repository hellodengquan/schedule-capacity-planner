<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排期容量规划工具</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 排期容量规划工具</h1>
            <p class="subtitle">团队排期 · 容量管理 · 依赖追踪</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="planning">规划结果</button>
            <button class="tab-btn" data-tab="stories">需求管理</button>
            <button class="tab-btn" data-tab="members">成员管理</button>
            <button class="tab-btn" data-tab="sprints">迭代管理</button>
            <button class="tab-btn" data-tab="dependencies">依赖管理</button>
            <button class="tab-btn" data-tab="skills">技能管理</button>
        </nav>

        <main>
            <section id="planning" class="tab-content active">
                <div class="actions">
                    <button class="btn btn-primary" onclick="runPlanning()">▶ 运行排期规划</button>
                    <button class="btn btn-secondary" onclick="loadSampleData()">📦 加载示例数据</button>
                    <button class="btn btn-secondary" onclick="refreshPlanning()">🔄 刷新</button>
                </div>
                <div id="planning-result"></div>
            </section>

            <section id="stories" class="tab-content">
                <div class="card">
                    <h2>添加需求</h2>
                    <form id="story-form" class="form-inline">
                        <input type="text" id="story-title" placeholder="需求标题" required>
                        <input type="number" id="story-estimate" placeholder="预估工时" step="0.5" min="0" required>
                        <input type="number" id="story-priority" placeholder="优先级" value="0">
                        <button type="submit" class="btn btn-primary">添加</button>
                    </form>
                </div>
                <div class="card">
                    <h2>需求列表 <span class="hint">(拖动排序 · 自动保存</span></h2>
                    <p class="tip">💡 拖动需求卡片可调整显示顺序，自动同步到后端</p>
                    <div id="stories-list" class="draggable-list></div>
                </div>
            </section>

            <section id="members" class="tab-content">
                <div class="card">
                    <h2>添加成员</h2>
                    <form id="member-form" class="form-inline">
                        <input type="text" id="member-name" placeholder="姓名" required>
                        <input type="number" id="member-capacity" placeholder="每迭代工时" step="0.5" min="0" value="40" required>
                        <button type="submit" class="btn btn-primary">添加</button>
                    </form>
                </div>
                <div class="card">
                    <h2>成员列表</h2>
                    <div id="members-list"></div>
                </div>
            </section>

            <section id="sprints" class="tab-content">
                <div class="card">
                    <h2>添加迭代</h2>
                    <form id="sprint-form" class="form-inline">
                        <input type="text" id="sprint-name" placeholder="迭代名称" required>
                        <input type="date" id="sprint-start">
                        <input type="date" id="sprint-end">
                        <button type="submit" class="btn btn-primary">添加</button>
                    </form>
                </div>
                <div class="card">
                    <h2>迭代列表</h2>
                    <div id="sprints-list"></div>
                </div>
            </section>

            <section id="dependencies" class="tab-content">
                <div class="card">
                    <h2>添加依赖</h2>
                    <form id="dependency-form" class="form-inline">
                        <select id="dep-story" required>
                            <option value="">选择需求</option>
                        </select>
                        <span>依赖</span>
                        <select id="dep-depends" required>
                            <option value="">选择依赖需求</option>
                        </select>
                        <button type="submit" class="btn btn-primary">添加</button>
                    </form>
                    <div id="cycle-warning" class="alert alert-error hidden"></div>
                </div>
                <div class="card">
                    <h2>依赖列表</h2>
                    <div id="dependencies-list"></div>
                </div>
            </section>

            <section id="skills" class="tab-content">
                <div class="card">
                    <h2>添加技能</h2>
                    <form id="skill-form" class="form-inline">
                        <input type="text" id="skill-name" placeholder="技能名称 (如: 前端、后端)" required>
                        <button type="submit" class="btn btn-primary">添加</button>
                    </form>
                </div>
                <div class="card">
                    <h2>技能列表</h2>
                    <div id="skills-list"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="story-skill-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
            <h3>设置需求技能</h3>
            <button class="close-btn" onclick="closeModal('story-skill-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <p class="story-skill-info"></p>
            <form id="story-skill-form">
                <select id="story-skill-select">
                    <option value="">选择技能</option>
                </select>
                <input type="number" id="story-skill-hours" placeholder="所需工时" step="0.5" min="0" value="0">
                <button type="submit" class="btn btn-primary">添加/更新</button>
            </form>
            <div id="story-skills-list"></div>
        </div>
    </div>
    </div>

    <div id="member-skill-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>设置成员技能</h3>
                <button class="close-btn" onclick="closeModal('member-skill-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p class="member-skill-info"></p>
                <form id="member-skill-form">
                    <select id="member-skill-select">
                        <option value="">选择技能</option>
                    </select>
                    <input type="number" id="member-skill-capacity" placeholder="每迭代容量" step="0.5" min="0" value="0">
                    <button type="submit" class="btn btn-primary">添加/更新</button>
                </form>
                <div id="member-skills-list"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/static/app.js"></script>
</body>
</html>
